databases:
  - name: foodcycle-db
    databaseName: foodcycle
    user: foodcycle_user
    plan: free
    region: singapore

services:
  # Option 1: Full-Stack Node / Express + React (Turnkey)
  - type: web
    name: foodcycle-app
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: foodcycle-db
          property: connectionString

